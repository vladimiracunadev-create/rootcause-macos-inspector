[package]
name = "rootcause-macos-inspector"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Vladimir Acuña <vladimiracunadev-create>"]
description = "Monitor visual y forense ligero para macOS: LaunchAgents/Daemons, procesos, Gatekeeper, XProtect, permisos TCC, red y persistencia."
license = "Apache-2.0"
repository = "https://github.com/vladimiracunadev-create/rootcause-macos-inspector"
publish = false

[[bin]]
name = "rootcause"
path = "src/main.rs"

# ── Ediciones del producto ──────────────────────────────────────────────────────
# Por defecto se compila con GUI completa.
# Para la edición CLI-only (sin egui):
#   cargo build --release --no-default-features
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.29", optional = true }
plist = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system", "network"] }
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
